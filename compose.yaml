services:
  # The API is NOT defined here any more. scripts/deploy.sh runs it as
  # api-blue / api-green so it can switch between them without downtime.
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/active:/etc/nginx/active
    networks:
      - app-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app-network:
    external: true      # created by scripts/deploy.sh if it does not exist
    name: app-network