name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # >>> Edit these two lines if your Docker Hub username or repository name differs <<<
  DOCKERHUB_USER: muhammadahsan513
  IMAGE: muhammadahsan513/fraud-detect-ecom

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"        # same minor version the model was trained with
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest==9.1.1 httpx==0.28.1

      - name: Use sample data (full dataset is not in the repo)
        run: |
          cp tests/data/orders_sample.csv orders-sheet.csv
          cp tests/data/scored_sample.csv scored_orders.csv

      - name: Run all tests
        run: pytest -v

  docker:
    # CD: only after tests pass, and only for pushes to main (never for pull requests)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Docker Hub token exists
        env:
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DH_TOKEN" ]; then
            echo "::error::Secret DOCKERHUB_TOKEN is missing. Add it under Settings > Secrets and variables > Actions > Repository secrets"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Build image locally for a smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name api -p 8000:8000 "$IMAGE:ci-test"
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health; then
              echo
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy. Container logs:"
          docker logs api
          exit 1

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha