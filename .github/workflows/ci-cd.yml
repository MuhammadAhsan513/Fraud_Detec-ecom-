name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"        # same minor version the model was trained with
          cache: pip
          cache-dependency-path: requirements-api.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-api.txt
          pip install pytest==9.1.1 httpx==0.28.1

      - name: Run unit and integration tests
        run: pytest tests/test_pipeline_ci.py -v

  docker:
    # CD: only after tests pass, and only for pushes to main (not pull requests)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/fraud-detect-ecom
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image locally for a smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name api -p 8000:8000 "$IMAGE:ci-test"
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done
          docker logs api
          exit 1

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
